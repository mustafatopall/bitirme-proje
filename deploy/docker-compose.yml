services:
  postgres:
    image: postgres:16-alpine
    container_name: efatura-postgres
    environment:
      POSTGRES_USER: efatura
      POSTGRES_PASSWORD: efatura
      POSTGRES_DB: efatura
    ports:
      - "5432:5432"
    cpus: 1.5
    mem_limit: 1g
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: efatura-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: efatura
      RABBITMQ_DEFAULT_PASS: efatura
    cpus: 2
    mem_limit: 1g

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: efatura-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    cpus: 2
    mem_limit: 2g

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: efatura-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    cpus: 1
    mem_limit: 512m

volumes:
  postgres-data:
